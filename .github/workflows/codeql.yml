name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '43 6 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual

    # Build the user-space tree the same way the build workflow does, so the
    # analysis sees every dependency the code needs.
    - name: Build
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config \
          zlib1g-dev liblzo2-dev liblz4-dev libzstd-dev libssl-dev libudev-dev
        make

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
